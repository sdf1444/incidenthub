name: Deploy API to existing AWS ECS service
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push API
        env:
          REGISTRY: ${{ vars.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/incidenthub-api:$IMAGE_TAG" -f apps/api/Dockerfile .
          docker push "$REGISTRY/incidenthub-api:$IMAGE_TAG"
      - name: Update existing ECS task definition and service
        env:
          REGISTRY: ${{ vars.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          TASK_ARN=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$TASK_ARN" --query 'taskDefinition' > task.json
          node -e 'const fs=require("fs");let t=JSON.parse(fs.readFileSync("task.json"));for(const k of ["taskDefinitionArn","revision","status","requiresAttributes","compatibilities","registeredAt","registeredBy"])delete t[k];const c=t.containerDefinitions.find(x=>x.name==="api");if(!c)throw Error("api container not found");c.image=process.env.REGISTRY+"/incidenthub-api:"+process.env.IMAGE_TAG;fs.writeFileSync("task-updated.json",JSON.stringify(t))'
          NEW_TASK=$(aws ecs register-task-definition --cli-input-json file://task-updated.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEW_TASK" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
